[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tetris-jev"
version = "0.1.0"
description = "Watch TypeSafe Jev play a placement-based Tetris game."
requires-python = ">=3.13"
dependencies = ["typesafe-sdk==0.7.0", "pygame>=2.6,<3", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
tetris-jev = "tetris_jev.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tetris_jev"]

[tool.ruff]
line-length = 100
target-version = "py313"

